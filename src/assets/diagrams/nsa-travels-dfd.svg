<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D9A25C"/>
    </marker>
  </defs>

  <rect width="960" height="620" fill="#0A0A0B"/>
  <text x="30" y="40" fill="#F2F2F0" font-size="20" font-weight="600">NSA Travels — Level 1 Data Flow Diagram</text>
  <text x="30" y="62" fill="#8A8A8E" font-size="12">Notation: System Analysis &amp; Design (Sem V) — external entity / process / data store</text>

  <!-- External Entities (sharp rectangles) -->
  <rect x="30" y="130" width="140" height="60" fill="none" stroke="#F2F2F0" stroke-width="1.5"/>
  <text x="100" y="165" fill="#F2F2F0" font-size="13" text-anchor="middle">Customer</text>

  <rect x="30" y="280" width="140" height="60" fill="none" stroke="#F2F2F0" stroke-width="1.5"/>
  <text x="100" y="315" fill="#F2F2F0" font-size="13" text-anchor="middle">Staff / Aalok</text>

  <rect x="30" y="430" width="140" height="60" fill="none" stroke="#F2F2F0" stroke-width="1.5"/>
  <text x="100" y="458" fill="#F2F2F0" font-size="13" text-anchor="middle">IATA / Tax</text>
  <text x="100" y="475" fill="#F2F2F0" font-size="13" text-anchor="middle">Authority</text>

  <!-- Central Process (rounded rect = process, DFD bubble convention) -->
  <rect x="330" y="250" width="260" height="110" rx="55" fill="none" stroke="#D9A25C" stroke-width="2"/>
  <text x="460" y="298" fill="#F2F2F0" font-size="15" text-anchor="middle" font-weight="600">1.0</text>
  <text x="460" y="318" fill="#F2F2F0" font-size="14" text-anchor="middle">NSA Travels Digital</text>
  <text x="460" y="336" fill="#F2F2F0" font-size="14" text-anchor="middle">Operations System</text>

  <!-- Data Stores (open rectangle, two horizontal lines) -->
  <g>
    <line x1="760" y1="120" x2="760" y2="170" stroke="#F2F2F0" stroke-width="1.5"/>
    <line x1="760" y1="120" x2="900" y2="120" stroke="#F2F2F0" stroke-width="1.5"/>
    <line x1="760" y1="170" x2="900" y2="170" stroke="#F2F2F0" stroke-width="1.5"/>
    <text x="830" y="150" fill="#F2F2F0" font-size="12" text-anchor="middle">D1 Customer /</text>
    <text x="830" y="165" fill="#F2F2F0" font-size="12" text-anchor="middle">B2B Records</text>
  </g>

  <g>
    <line x1="760" y1="260" x2="760" y2="310" stroke="#F2F2F0" stroke-width="1.5"/>
    <line x1="760" y1="260" x2="900" y2="260" stroke="#F2F2F0" stroke-width="1.5"/>
    <line x1="760" y1="310" x2="900" y2="310" stroke="#F2F2F0" stroke-width="1.5"/>
    <text x="830" y="290" fill="#F2F2F0" font-size="12" text-anchor="middle">D2 Accounting</text>
    <text x="830" y="305" fill="#F2F2F0" font-size="12" text-anchor="middle">Ledger</text>
  </g>

  <g>
    <line x1="760" y1="400" x2="760" y2="450" stroke="#F2F2F0" stroke-width="1.5"/>
    <line x1="760" y1="400" x2="900" y2="400" stroke="#F2F2F0" stroke-width="1.5"/>
    <line x1="760" y1="450" x2="900" y2="450" stroke="#F2F2F0" stroke-width="1.5"/>
    <text x="830" y="430" fill="#F2F2F0" font-size="12" text-anchor="middle">D3 Cloud</text>
    <text x="830" y="445" fill="#F2F2F0" font-size="12" text-anchor="middle">Document Store</text>
  </g>

  <!-- Flows -->
  <path d="M170,160 C 250,160 250,270 330,290" fill="none" stroke="#D9A25C" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <text x="200" y="200" fill="#8A8A8E" font-size="11">booking / visa request</text>

  <path d="M170,310 C 250,310 250,300 330,300" fill="none" stroke="#D9A25C" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <text x="200" y="295" fill="#8A8A8E" font-size="11">ticket entry</text>

  <path d="M170,460 C 250,460 250,340 330,330" fill="none" stroke="#D9A25C" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <text x="185" y="410" fill="#8A8A8E" font-size="11">compliance rules</text>

  <path d="M590,290 C 680,270 680,180 760,150" fill="none" stroke="#D9A25C" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <path d="M590,305 C 680,300 680,290 760,285" fill="none" stroke="#D9A25C" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <path d="M590,320 C 680,350 680,420 760,425" fill="none" stroke="#D9A25C" stroke-width="1.5" marker-end="url(#arrow1)"/>

  <text x="480" y="560" fill="#8A8A8E" font-size="12" text-anchor="middle">Process 1.0 replaces the old manual path: Excel sheets → paper ledgers → scattered files</text>
</svg>
