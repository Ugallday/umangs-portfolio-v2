  <text x="480" y="168" fill="#F2F2F0" font-size="14" text-anchor="middle" font-weight="600">React 19 + TypeScript Web Client</text>
  <text x="480" y="188" fill="#8A8A8E" font-size="12" text-anchor="middle">Expense dashboard · Receipt capture (Tesseract.js OCR) · AI travel planner UI</text>

