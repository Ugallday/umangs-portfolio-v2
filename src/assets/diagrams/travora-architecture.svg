  <text x="295" y="358" fill="#8A8A8E" font-size="12" text-anchor="middle">Expense use cases</text>
  <text x="295" y="374" fill="#8A8A8E" font-size="12" text-anchor="middle">Trip planning use cases</text>

  <rect x="500" y="300" width="330" height="100" rx="8" fill="none" stroke="#F2F2F0" stroke-width="1.5"/>
  <text x="665" y="338" fill="#F2F2F0" font-size="14" text-anchor="middle" font-weight="600">Groq LLaMA 3.3-70B</text>
  <text x="665" y="358" fill="#8A8A8E" font-size="12" text-anchor="middle">AI travel planning</text>
  <text x="665" y="374" fill="#8A8A8E" font-size="12" text-anchor="middle">Natural-language assistance</text>

  <path d="M460,350 L500,350" stroke="#D9A25C" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <path d="M295,400 L295,435" stroke="#D9A25C" stroke-width="1.5" marker-end="url(#arrow2)"/>

