  </defs>

  <rect width="960" height="620" fill="#0A0A0B"/>
  <text x="30" y="40" fill="#F2F2F0" font-size="20" font-weight="600">Travora — Three-Tier System Architecture</text>
  <text x="30" y="62" fill="#8A8A8E" font-size="12">Notation: Software Engineering (Sem VI) layered architecture diagram</text>

  <!-- Tier labels -->
  <text x="480" y="110" fill="#D9A25C" font-size="13" text-anchor="middle" letter-spacing="1">PRESENTATION TIER</text>
