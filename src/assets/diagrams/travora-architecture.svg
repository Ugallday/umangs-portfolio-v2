<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D9A25C"/>
    </marker>
  </defs>

  <rect width="960" height="620" fill="#0A0A0B"/>
  <text x="30" y="40" fill="#F2F2F0" font-size="20" font-weight="600">Travora — Three-Tier System Architecture</text>
  <text x="30" y="62" fill="#8A8A8E" font-size="12">Notation: layered architecture diagram · seventh-semester project</text>

  <!-- Tier labels -->
  <text x="480" y="110" fill="#D9A25C" font-size="13" text-anchor="middle" letter-spacing="1">PRESENTATION TIER</text>
  <rect x="130" y="130" width="700" height="90" rx="8" fill="none" stroke="#F2F2F0" stroke-width="1.5"/>
  <text x="480" y="168" fill="#F2F2F0" font-size="14" text-anchor="middle" font-weight="600">React 19 + TypeScript SPA (Vite · Tailwind · Radix)</text>
  <text x="480" y="188" fill="#8A8A8E" font-size="12" text-anchor="middle">Onboarding interview · wallet and expense entry · receipt capture (Tesseract.js OCR, in-browser) · assistant</text>

  <path d="M480,220 L480,255" stroke="#D9A25C" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <text x="480" y="280" fill="#D9A25C" font-size="13" text-anchor="middle" letter-spacing="1">APPLICATION / BUSINESS LOGIC TIER</text>
  <rect x="130" y="300" width="330" height="100" rx="8" fill="none" stroke="#F2F2F0" stroke-width="1.5"/>
  <text x="295" y="332" fill="#F2F2F0" font-size="14" text-anchor="middle" font-weight="600">Client state (Zustand)</text>
  <text x="295" y="352" fill="#8A8A8E" font-size="12" text-anchor="middle">Trip and budget use cases</text>
  <text x="295" y="368" fill="#8A8A8E" font-size="12" text-anchor="middle">Expense entry · category breakdown</text>
  <text x="295" y="384" fill="#8A8A8E" font-size="12" text-anchor="middle">Rate stored per expense, never re-fetched</text>

  <rect x="500" y="300" width="330" height="100" rx="8" fill="none" stroke="#F2F2F0" stroke-width="1.5"/>
  <text x="665" y="332" fill="#F2F2F0" font-size="14" text-anchor="middle" font-weight="600">Groq LLaMA</text>
  <text x="665" y="352" fill="#8A8A8E" font-size="12" text-anchor="middle">Itinerary generation from the trip record</text>
  <text x="665" y="368" fill="#8A8A8E" font-size="12" text-anchor="middle">Drafts only — it computes no figure</text>
  <text x="665" y="384" fill="#8A8A8E" font-size="12" text-anchor="middle">Result stored back onto the trip</text>

  <path d="M460,350 L500,350" stroke="#D9A25C" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <path d="M295,400 L295,435" stroke="#D9A25C" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <text x="480" y="460" fill="#D9A25C" font-size="13" text-anchor="middle" letter-spacing="1">DATA TIER</text>
  <rect x="130" y="480" width="700" height="90" rx="8" fill="none" stroke="#F2F2F0" stroke-width="1.5"/>
  <text x="480" y="512" fill="#F2F2F0" font-size="14" text-anchor="middle" font-weight="600">Supabase — PostgreSQL + Auth</text>
  <text x="480" y="532" fill="#8A8A8E" font-size="12" text-anchor="middle">users · trips · categories · expenses · chat_messages</text>
  <text x="480" y="552" fill="#D9A25C" font-size="12" text-anchor="middle">Row-level security enabled on all five tables — ownership is enforced here, not in the client</text>

  <text x="480" y="600" fill="#8A8A8E" font-size="12" text-anchor="middle">BSc CSIT seventh-semester project · deployed at travora.aalokbhandari.com.np</text>
</svg>
