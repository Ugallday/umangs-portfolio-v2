  <path d="M340,150 L370,150" stroke="#D9A25C" stroke-width="1.5" marker-end="url(#arrow7)"/>

  <g>
    <rect x="370" y="110" width="140" height="80" rx="6" fill="none" stroke="#D9A25C" stroke-width="2"/>
    <text x="440" y="145" fill="#F2F2F0" font-size="13" text-anchor="middle">Gantt</text>
    <text x="440" y="162" fill="#F2F2F0" font-size="13" text-anchor="middle">Scheduling</text>
  </g>
  <path d="M510,150 L540,150" stroke="#D9A25C" stroke-width="1.5" marker-end="url(#arrow7)"/>

  <g>
    <rect x="540" y="110" width="140" height="80" rx="6" fill="none" stroke="#F2F2F0" stroke-width="1.5"/>
    <text x="610" y="145" fill="#F2F2F0" font-size="13" text-anchor="middle">Risk</text>
    <text x="610" y="162" fill="#F2F2F0" font-size="13" text-anchor="middle">Register</text>
  </g>
  <path d="M680,150 L710,150" stroke="#D9A25C" stroke-width="1.5" marker-end="url(#arrow7)"/>

  <g>
    <rect x="710" y="110" width="140" height="80" rx="6" fill="none" stroke="#F2F2F0" stroke-width="1.5"/>
