<svg viewBox="0 0 960 730" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="arrowVbs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D9A25C"/>
    </marker>
  </defs>

  <rect width="960" height="730" fill="#0A0A0B"/>
  <text x="30" y="40" fill="#F2F2F0" font-size="20" font-weight="600">VAT Billing System — local-first, multi-tenant architecture</text>
  <text x="30" y="62" fill="#8A8A8E" font-size="12">Notation: layered architecture with an explicit sync boundary</text>

  <!-- Client installation -->
  <text x="480" y="110" fill="#D9A25C" font-size="13" text-anchor="middle" letter-spacing="1">CLIENT INSTALLATION — RUNS FULLY OFFLINE</text>
  <rect x="60" y="125" width="840" height="300" rx="10" fill="none" stroke="#3A3A3E" stroke-width="1.5" stroke-dasharray="6 5"/>

  <rect x="90" y="150" width="780" height="60" rx="8" fill="none" stroke="#F2F2F0" stroke-width="1.5"/>
  <text x="480" y="176" fill="#F2F2F0" font-size="14" text-anchor="middle" font-weight="600">Views — transactions · masters · reports · administration</text>
  <text x="480" y="196" fill="#8A8A8E" font-size="12" text-anchor="middle">A view never computes a balance; it asks the core for figures</text>

  <path d="M480,210 L480,240" stroke="#D9A25C" stroke-width="1.5" marker-end="url(#arrowVbs)"/>

  <rect x="90" y="245" width="250" height="90" rx="8" fill="none" stroke="#F2F2F0" stroke-width="1.5"/>
  <text x="215" y="277" fill="#F2F2F0" font-size="14" text-anchor="middle" font-weight="600">ledger.js</text>
  <text x="215" y="299" fill="#8A8A8E" font-size="12" text-anchor="middle">Posting rules · balance check</text>
  <text x="215" y="317" fill="#8A8A8E" font-size="12" text-anchor="middle">The source of every figure</text>

  <rect x="355" y="245" width="250" height="90" rx="8" fill="none" stroke="#F2F2F0" stroke-width="1.5"/>
  <text x="480" y="277" fill="#F2F2F0" font-size="14" text-anchor="middle" font-weight="600">fiscal.js · auth.js</text>
  <text x="480" y="299" fill="#8A8A8E" font-size="12" text-anchor="middle">Closed years · 5 ranked roles</text>
  <text x="480" y="317" fill="#8A8A8E" font-size="12" text-anchor="middle">12,000-round password hashing</text>

  <rect x="620" y="245" width="250" height="90" rx="8" fill="none" stroke="#F2F2F0" stroke-width="1.5"/>
  <text x="745" y="277" fill="#F2F2F0" font-size="14" text-anchor="middle" font-weight="600">sync.js · schema-map.js</text>
  <text x="745" y="299" fill="#8A8A8E" font-size="12" text-anchor="middle">Outbox, push/pull, merging</text>
  <text x="745" y="317" fill="#8A8A8E" font-size="12" text-anchor="middle">One shared column map</text>

  <path d="M480,335 L480,360" stroke="#D9A25C" stroke-width="1.5" marker-end="url(#arrowVbs)"/>

  <rect x="90" y="360" width="780" height="48" rx="8" fill="none" stroke="#F2F2F0" stroke-width="1.5"/>
  <text x="480" y="389" fill="#F2F2F0" font-size="14" text-anchor="middle" font-weight="600">Store — whole database in memory, persisted to IndexedDB, with a persisted outbox</text>

  <!-- Sync boundary -->
  <path d="M300,425 L300,505" stroke="#D9A25C" stroke-width="1.5" marker-end="url(#arrowVbs)"/>
  <text x="312" y="452" fill="#8A8A8E" font-size="12">push — batched upserts and tombstones, before any read</text>
  <path d="M660,505 L660,425" stroke="#D9A25C" stroke-width="1.5" marker-end="url(#arrowVbs)"/>
  <text x="648" y="482" fill="#8A8A8E" font-size="12" text-anchor="end">pull — every row newer than this machine's watermark</text>

  <!-- Server -->
  <text x="480" y="537" fill="#D9A25C" font-size="13" text-anchor="middle" letter-spacing="1">ONE SUPABASE / POSTGRESQL DEPLOYMENT — EVERY CLIENT</text>
  <rect x="60" y="552" width="840" height="145" rx="10" fill="none" stroke="#F2F2F0" stroke-width="1.5"/>
  <text x="480" y="582" fill="#F2F2F0" font-size="14" text-anchor="middle" font-weight="600">Row-level security keyed to the tenant id inside the signed JWT</text>
  <text x="480" y="602" fill="#8A8A8E" font-size="12" text-anchor="middle">vouchers · ledger_lines · parties · accounts · fiscal_years — composite keys cannot point across a tenant</text>

  <rect x="90" y="616" width="245" height="44" rx="8" fill="none" stroke="#3A3A3E" stroke-width="1.5"/>
  <text x="212" y="643" fill="#F2F2F0" font-size="13" text-anchor="middle">Tenant A — their books only</text>

  <rect x="357" y="616" width="245" height="44" rx="8" fill="none" stroke="#3A3A3E" stroke-width="1.5"/>
  <text x="479" y="643" fill="#F2F2F0" font-size="13" text-anchor="middle">Tenant B — their books only</text>

  <rect x="624" y="616" width="245" height="44" rx="8" fill="none" stroke="#3A3A3E" stroke-width="1.5"/>
  <text x="746" y="643" fill="#F2F2F0" font-size="13" text-anchor="middle">Tenant C — their books only</text>

  <text x="480" y="682" fill="#8A8A8E" font-size="12" text-anchor="middle">Edge functions — provision-tenant issues the activation key · send-mail relays the PDF</text>

  <text x="480" y="720" fill="#8A8A8E" font-size="12" text-anchor="middle">Every report is a view over one balanced ledger — losing the connection queues work, it never stops it</text>
</svg>
