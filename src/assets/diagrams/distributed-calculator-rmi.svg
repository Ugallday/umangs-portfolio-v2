<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="arrow6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D9A25C"/>
    </marker>
  </defs>

  <rect width="960" height="460" fill="#0A0A0B"/>
  <text x="30" y="40" fill="#F2F2F0" font-size="20" font-weight="600">Java RMI Distributed Calculator — Client-Server Flow</text>
  <text x="30" y="62" fill="#8A8A8E" font-size="12">Advanced Java practical — Sem VII, remote method invocation</text>

  <rect x="60" y="180" width="200" height="80" rx="6" fill="none" stroke="#F2F2F0" stroke-width="1.5"/>
  <text x="160" y="215" fill="#F2F2F0" font-size="14" text-anchor="middle">RMI Client</text>
  <text x="160" y="232" fill="#8A8A8E" font-size="11" text-anchor="middle">calls remote calculate()</text>

  <rect x="380" y="80" width="220" height="80" rx="6" fill="none" stroke="#D9A25C" stroke-width="2"/>
  <text x="490" y="115" fill="#F2F2F0" font-size="14" text-anchor="middle">RMI Registry</text>
  <text x="490" y="132" fill="#8A8A8E" font-size="11" text-anchor="middle">lookup / bind service</text>

  <rect x="380" y="280" width="220" height="80" rx="6" fill="none" stroke="#F2F2F0" stroke-width="1.5"/>
  <text x="490" y="315" fill="#F2F2F0" font-size="14" text-anchor="middle">Calculator Server</text>
  <text x="490" y="332" fill="#8A8A8E" font-size="11" text-anchor="middle">implements remote interface</text>

  <rect x="700" y="180" width="200" height="80" rx="6" fill="none" stroke="#F2F2F0" stroke-width="1.5"/>
  <text x="800" y="215" fill="#F2F2F0" font-size="14" text-anchor="middle">Result</text>
  <text x="800" y="232" fill="#8A8A8E" font-size="11" text-anchor="middle">returned over the network</text>

  <path d="M260,205 C 320,180 340,140 380,120" fill="none" stroke="#D9A25C" stroke-width="1.5" marker-end="url(#arrow6)"/>
  <text x="270" y="165" fill="#8A8A8E" font-size="11">1. lookup stub</text>

  <path d="M260,225 C 320,260 340,280 380,300" fill="none" stroke="#D9A25C" stroke-width="1.5" marker-end="url(#arrow6)"/>
  <text x="270" y="270" fill="#8A8A8E" font-size="11">2. invoke method</text>

  <path d="M600,300 C 660,270 660,230 700,215" fill="none" stroke="#D9A25C" stroke-width="1.5" marker-end="url(#arrow6)"/>
  <text x="605" y="270" fill="#8A8A8E" font-size="11">3. return value</text>

  <text x="480" y="420" fill="#8A8A8E" font-size="12" text-anchor="middle">Simple, curriculum-aligned RMI pattern — no external frameworks</text>
</svg>
